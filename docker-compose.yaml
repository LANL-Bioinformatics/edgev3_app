services:
  edgev3_web:
    image: nginx:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./data/web_nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/splash.html:/usr/share/nginx/html/splash.html
    command:
    - /bin/sh
    - -c
    - |
      mkdir -p /etc/nginx/logs
      while :; do
        sleep 6h & wait $${!}
        nginx -s reload
      done &
      nginx -g "daemon off;"
  edgev3_nextflow:
    image: edgev3-nextflow:20260908
    platform: linux/amd64
    user: "1000:${EDGEV3_HOST_GID:-1000}"
    init: true
    restart: always
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      # The runner library is generic; the tool is 'nextflow'. The service name
      # (edgev3_nextflow) is what the webapp's NEXTFLOW_RUNNER_NAME must match.
      RUNNER_TOOL: nextflow
      RUNNER_PORT: 7001
      RUNNER_ALLOWED_ROOTS: /edgev3/io:/edgev3/workflows:/project/refdata
      RUNNER_STATE_DB: /edgev3/io/job_runner/jobs.sqlite3
      RUNNER_CONCURRENCY: "${NEXTFLOW_RUNNER_CONCURRENCY:-1}"
      RUNNER_API_TOKEN_FILE: /run/secrets/nextflow_runner_token
      NEXTFLOW_EXEC: /opt/conda/envs/edgev3/bin/nextflow
      NEXTFLOW_SLURM_SSH: "${NEXTFLOW_SLURM_SSH:-}"
      NEXTFLOW_REMOTE_EXEC: "${NEXTFLOW_REMOTE_EXEC:-nextflow}"
    depends_on:
      edgev3_data_init:
        condition: service_completed_successfully
    expose:
      - "7001"
    secrets:
      - nextflow_runner_token
    volumes:
      - ./data/output/projects:/edgev3/io/projects
      - ./data/output/db:/edgev3/io/db
      - ./data/output/log:/edgev3/io/log
      - ./data/output/public:/edgev3/io/public
      - ./data/output/sra:/edgev3/io/sra
      - ./data/output/upload:/edgev3/io/upload
      - ./data/output/bulksubmissions:/edgev3/io/bulksubmissions
      - ./data/output/job_runner:/edgev3/io/job_runner
      - ./data/container.config:/edgev3/workflows/Nextflow/metagenomics/configs/container.config:ro
      - ./data/local.config:/edgev3/workflows/Nextflow/metagenomics/configs/local.config:ro
      - ./data/refdata:/project/refdata
    healthcheck:
      test:
        - CMD
        - /opt/conda/envs/edgev3/bin/python
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:7001/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  edgev3_admin_init:
    image: edgev3:20260908
    platform: linux/amd64
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    secrets:
      - mongo_app_user
      - mongo_app_pass
      - edgev3_admin_password
      - edgev3_admin_code
    volumes:
      - ./src/edgev3-mongo/installation/init-edgev3-admin.js:/runtime/init-edgev3-admin.js:ro
    command: ["node", "/runtime/init-edgev3-admin.js"]
  edgev3_data_init:
    image: edgev3:20260908
    platform: linux/amd64
    user: "0:0"
    restart: "no"
    environment:
      EDGEV3_HOST_GID: "${EDGEV3_HOST_GID:-1000}"
    volumes:
      - ./data/output/projects:/edgev3/io/projects
      - ./data/output/db:/edgev3/io/db
      - ./data/output/log:/edgev3/io/log
      - ./data/output/public:/edgev3/io/public
      - ./data/output/sra:/edgev3/io/sra
      - ./data/output/upload:/edgev3/io/upload
      - ./data/output/bulksubmissions:/edgev3/io/bulksubmissions
      - ./data/output/job_runner:/edgev3/io/job_runner
    command:
      - /bin/sh
      - -c
      - |
        runtime_paths="/edgev3/io/projects /edgev3/io/db /edgev3/io/log /edgev3/io/public /edgev3/io/sra /edgev3/io/upload /edgev3/io/bulksubmissions /edgev3/io/job_runner"
        chown -R "1000:$${EDGEV3_HOST_GID}" $${runtime_paths}
        find $${runtime_paths} -type d -exec chmod 2770 {} \;
        find $${runtime_paths} -type f -exec chmod 0660 {} \;
  edgev3:
    image: edgev3:20260908
    platform: linux/amd64
    init: true
    restart: always 
    command:
      - /bin/sh
      - -c
      - | 
        set -e
        cd /edgev3/webapp/client/
        npm run build
        cd /edgev3
        exec pm2-runtime pm2.config.js
      ## set up jbrowse in projects dir
      ## rebuild the client site since the bind client .env
      ## start the node server and front end mode
    depends_on:
      edgev3_web:
        condition: service_started
      mongodb:
        condition: service_healthy
      edgev3_admin_init:
        condition: service_completed_successfully
      edgev3_data_init:
        condition: service_completed_successfully
      edgev3_nextflow:
        condition: service_healthy
    ports:
      - "5000:5000"
    secrets:
      - nextflow_runner_token
    volumes:
      - ./data/secrets/webapp_server.env:/edgev3/webapp/server/.env:ro
      - ./data/webapp_client.env:/edgev3/webapp/client/.env:ro
      - ./data/output/projects:/edgev3/io/projects
      - ./data/output/db:/edgev3/io/db
      - ./data/output/log:/edgev3/io/log
      - ./data/output/public:/edgev3/io/public
      - ./data/output/sra:/edgev3/io/sra
      - ./data/output/upload:/edgev3/io/upload
      - ./data/output/bulksubmissions:/edgev3/io/bulksubmissions
      - ./data/container.config:/edgev3/workflows/Nextflow/metagenomics/configs/container.config
      - ./data/local.config:/edgev3/workflows/Nextflow/metagenomics/configs/local.config
      #- ./data/nextflow.config:/edgev3/workflows/Nextflow/metagenomics/nextflow/nextflow.config
      - ./data/refdata:/project/refdata
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:5000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
  mongodb:
    image: edgev3-mongo:20260818
    restart: always 
    platform: linux/amd64
    entrypoint:
      - /bin/bash
      - -c
      - |
        export MONGODB_INITDB_ROOT_USERNAME="$$(cat /run/secrets/mongo_root_user)"
        export MONGODB_INITDB_ROOT_PASSWORD="$$(cat /run/secrets/mongo_root_pass)"
        exec python3 /usr/local/bin/docker-entrypoint.py mongod
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    secrets:
      - mongo_root_user
      - mongo_root_pass
      - mongo_app_user
      - mongo_app_pass
      - mongo_admin_user
      - mongo_admin_pass
    environment:
      MONGO_APP_USER_FILE: /run/secrets/mongo_app_user
      MONGO_APP_PASS_FILE: /run/secrets/mongo_app_pass
      MONGO_ADMIN_USER_FILE: /run/secrets/mongo_admin_user
      MONGO_ADMIN_PASS_FILE: /run/secrets/mongo_admin_pass
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$(cat /run/secrets/mongo_app_user)"
          --password "$$(cat /run/secrets/mongo_app_pass)"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  mongo_root_user:
    file: ./data/secrets/mongo_root_user.txt
  mongo_root_pass:
    file: ./data/secrets/mongo_root_pass.txt
  mongo_app_user:
    file: ./data/secrets/mongo_app_user.txt
  mongo_app_pass:
    file: ./data/secrets/mongo_app_pass.txt
  mongo_admin_user:
    file: ./data/secrets/mongo_admin_user.txt
  mongo_admin_pass:
    file: ./data/secrets/mongo_admin_pass.txt
  edgev3_admin_password:
    file: ./data/secrets/edgev3_admin_password.txt
  edgev3_admin_code:
    file: ./data/secrets/edgev3_admin_code.txt
  nextflow_runner_token:
    file: ./data/secrets/nextflow_runner_token.txt

volumes:
  mongo_data:
